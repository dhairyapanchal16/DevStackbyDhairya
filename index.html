<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevStack Docs - DevOps Document Sharing Platform</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="logo">
                <i class="fas fa-code"></i>
                <h1>DevStack by Dhairya </h1>
            </div>
            <p class="tagline">Your DevOps Learning Hub - Happy Learning</p>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="filter-section">
                <h2>Browse Documents</h2>
                <div class="filter-buttons">
                    <button class="filter-btn active" data-category="all">All</button>
                    <button class="filter-btn" data-category="Ansible">Ansible</button>
                    <button class="filter-btn" data-category="Artificial_Intelligence_Fundamentals">AI Fundamentals</button>
                    <button class="filter-btn" data-category="AWS">AWS</button>
                    <button class="filter-btn" data-category="Azure">Azure</button>
                    <button class="filter-btn" data-category="Azure_DevOps">Azure DevOps</button>
                    <button class="filter-btn" data-category="Git">Git</button>
                    <button class="filter-btn" data-category="Kubernetes">Kubernetes</button>
                    <button class="filter-btn" data-category="Linux">Linux</button>
                    <button class="filter-btn" data-category="Prompt_Engineering">Prompt Engineering</button>
                    <button class="filter-btn" data-category="Shell_Scripting">Shell Scripting</button>
                    <button class="filter-btn" data-category="Terraform">Terraform</button>
                    <button class="filter-btn" data-category="YAML_Scripting">YAML Scripting</button>
                </div>
            </div>

            <div class="documents-grid" id="documentsGrid">
                <!-- Documents will be dynamically generated here -->
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>Built by Dhairya | DevStack Docs 2026</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
